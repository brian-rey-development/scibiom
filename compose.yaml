name: scibiom

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SCIBIOM_OWNER_PASSWORD: ${SCIBIOM_OWNER_PASSWORD:?set SCIBIOM_OWNER_PASSWORD in .env}
      SCIBIOM_APP_PASSWORD: ${SCIBIOM_APP_PASSWORD:?set SCIBIOM_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The init-time server listens on the unix socket only, so probing TCP
      # keeps the container unhealthy until initdb scripts have finished.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      # The image has no shell, so the probe is the binary's own readiness command.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
