[project]
name = "scibiom-infrastructure"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy[asyncio]>=2.1.9",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "alembic>=1.20.1",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg"] # SQLAlchemy loads the driver from the postgresql+psycopg URL

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
